name: Deploy application

on:
  push:
    branches: [main]
    paths: ["website/**", "api/**", ".github/workflows/deploy-application.yml"]
  pull_request:
    paths: ["website/**", "api/**", ".github/workflows/deploy-application.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install and test waitlist API
        working-directory: api
        run: npm ci && npm test

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: website-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
      AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install waitlist API
        working-directory: api
        run: npm ci
      - name: Get deployment target and token
        id: target
        run: |
          set -euo pipefail
          : "${AZURE_RESOURCE_GROUP_NAME:?Set AZURE_RESOURCE_GROUP_NAME}"
          : "${AZURE_STATIC_WEB_APP_NAME:?Set AZURE_STATIC_WEB_APP_NAME}"
          token=$(az staticwebapp secrets list \
            --name "$AZURE_STATIC_WEB_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --query properties.apiKey -o tsv)
          hostname=$(az staticwebapp show \
            --name "$AZURE_STATIC_WEB_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --query defaultHostname -o tsv)
          test -n "$token"
          test -n "$hostname"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"
      - name: Publish website and managed API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.target.outputs.token }}
          action: upload
          app_location: website
          api_location: api
          skip_app_build: true
          production_branch: main
      - name: Smoke test published website and API
        env:
          HOSTNAME: ${{ steps.target.outputs.hostname }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "https://$HOSTNAME/" -o "$RUNNER_TEMP/site.html" &&
               grep -qi 'Bomkeeper' "$RUNNER_TEMP/site.html" &&
               status=$(curl --silent --show-error -o "$RUNNER_TEMP/api.html" -w '%{http_code}' \
                 "https://$HOSTNAME/api/waitlist/confirm") &&
               [ "$status" = "400" ] &&
               grep -q 'This link is invalid or expired' "$RUNNER_TEMP/api.html"; then
              echo "Website and configured managed API are reachable."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Website/API smoke test failed after deployment."
          exit 1
