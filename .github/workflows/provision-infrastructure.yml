name: Provision infrastructure

on:
  push:
    branches: [main]
    paths: ["infrastructure/**", ".github/workflows/provision-infrastructure.yml"]
  pull_request:
    paths: ["infrastructure/**", ".github/workflows/provision-infrastructure.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.11.4"
      - name: Validate infrastructure
        working-directory: infrastructure
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

  provision:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: infrastructure-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Initialize secured infrastructure state
        working-directory: infrastructure
        env:
          STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
          STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          set -euo pipefail
          : "${ARM_CLIENT_ID:?Set AZURE_CLIENT_ID}"
          : "${ARM_TENANT_ID:?Set AZURE_TENANT_ID}"
          : "${ARM_SUBSCRIPTION_ID:?Set AZURE_SUBSCRIPTION_ID}"
          : "${STATE_RESOURCE_GROUP:?Set TF_STATE_RESOURCE_GROUP}"
          : "${STATE_STORAGE_ACCOUNT:?Set TF_STATE_STORAGE_ACCOUNT}"
          : "${STATE_CONTAINER:?Set TF_STATE_CONTAINER}"
          : "${STATE_KEY:?Set TF_STATE_KEY}"
          terraform init -input=false -lockfile=readonly \
            -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=$STATE_KEY"
      - name: Provision infrastructure
        working-directory: infrastructure
        run: |
          umask 077
          terraform plan -var-file=terraform.tfvars -out="$RUNNER_TEMP/deployment.tfplan"
          terraform apply -input=false "$RUNNER_TEMP/deployment.tfplan"
      - name: Remove local deployment secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/deployment.tfplan"
